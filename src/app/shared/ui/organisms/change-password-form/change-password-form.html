<form (submit)="submit($event)" class="space-y-4">
  @if (errorMessage()) {
    <app-alert variant="danger" [dismissible]="true" (dismissed)="errorMessage.set(null)">
      {{ errorMessage() }}
    </app-alert>
  }

  <app-form-field
    label="Nueva Contraseña"
    [required]="true"
    [errorMessage]="errors()['newPassword']"
    hint="Mínimo 8 caracteres, con una letra y un número"
  >
    <app-password-input
      [value]="newPassword()"
      (valueChange)="updateField('newPassword', $event)"
      id="new-password"
    />
  </app-form-field>

  <app-form-field
    label="Confirmar Nueva Contraseña"
    [required]="true"
    [errorMessage]="errors()['confirmPassword']"
  >
    <app-password-input
      [value]="confirmPassword()"
      (valueChange)="updateField('confirmPassword', $event)"
      id="confirm-new-password"
    />
  </app-form-field>

  <app-button type="submit" variant="primary" [loading]="loading()" customClass="w-full">
    Guardar y Continuar
  </app-button>

  <div class="text-center">
    <button
      type="button"
      (click)="cancelled.emit()"
      class="text-xs text-slate-500 hover:text-slate-700 underline cursor-pointer"
    >
      Cancelar
    </button>
  </div>
</form>
