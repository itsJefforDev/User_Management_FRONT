<div
  [class]="containerClasses()"
  class="relative inline-flex items-center justify-center rounded-full bg-slate-200 text-slate-700 font-semibold overflow-hidden select-none"
>
  @if (src()) {
    <img [src]="src()" [alt]="name()" class="h-full w-full object-cover" />
  } @else {
    <span>{{ initials() }}</span>
  }
</div>
