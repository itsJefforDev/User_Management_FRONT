<div class="min-h-screen bg-slate-50 flex font-sans">
  <!-- Sidebar de navegación (expandible) -->
  <app-sidebar (editProfile)="showProfileModal.set(true)" />

  <div class="flex-1 min-w-0 flex flex-col">
    <!-- Barra superior -->
    <header class="workspace-topbar sticky top-0 z-20 bg-white/95 backdrop-blur-md border-b border-slate-200">
      <div class="h-16 px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <!-- Abrir menú (móvil) -->
          <button type="button" (click)="sidebar.openMobile()" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 cursor-pointer" aria-label="Abrir menú">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <h2 class="text-sm sm:text-base font-semibold text-slate-800 truncate">{{ appTitle() }}</h2>
        </div>

        <div class="flex items-center gap-3 shrink-0">
          <app-badge [variant]="authService.isAdmin() ? 'danger' : 'info'" size="sm">
            {{ authService.userRole() }}
          </app-badge>
          <span class="hidden sm:block text-xs font-semibold text-slate-700">{{ authService.userDisplayName() }}</span>
          <app-avatar [name]="authService.userDisplayName()" size="sm" />
        </div>
      </div>
    </header>

    <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
      @if (notificationService.currentAlert(); as alert) {
        <div class="mb-6 animate-fade-in">
          <app-alert
            [variant]="alert.type"
            [title]="alert.title || ''"
            [dismissible]="true"
            (dismissed)="notificationService.clear()"
          >
            {{ alert.message }}
          </app-alert>
        </div>
      }

      <ng-content></ng-content>
    </main>

    <app-footer />
  </div>
</div>

@if (showProfileModal()) {
  <app-edit-profile-modal (closed)="showProfileModal.set(false)" />
}
