<div class="relative flex items-center w-full max-w-md">
  <!-- Search Icon -->
  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 z-10">
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
      />
    </svg>
  </div>

  <!-- Atom: Input -->
  <app-input
    customClass="pl-9 pr-24"
    [value]="query()"
    (valueChange)="onQueryChange($event)"
    placeholder="Buscar usuarios por nombre, email o rol..."
  />

  <!-- Actions: Clear & Atom: Button -->
  <div class="absolute inset-y-0 right-1 flex items-center z-10">
    @if (query()) {
      <button
        type="button"
        (click)="clearQuery()"
        class="p-1 mr-1 text-slate-400 hover:text-slate-600 rounded-md focus:outline-none cursor-pointer"
        title="Limpiar"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    }
    <app-button size="sm" variant="primary" (clicked)="triggerSearch()">
      Buscar
    </app-button>
  </div>
</div>
