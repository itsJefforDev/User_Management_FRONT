<app-main-layout appTitle="Gestión de Usuarios">
  <div class="space-y-6">
    <!-- Header Page Section (Organism/Molecule integration) -->
    <div class="sm:flex sm:items-center sm:justify-between pb-5 border-b border-slate-200">
      <div>
        <div class="flex items-center gap-3">
          <h1 class="text-2xl font-bold tracking-tight text-slate-900">Usuarios</h1>
          <app-badge variant="info">{{ userService.filteredUsers().length }} registrados</app-badge>
        </div>
        <p class="mt-1 text-sm text-slate-500">
          Administra los usuarios del sistema, sus roles de acceso y estados de cuenta.
        </p>
      </div>

      <div class="mt-4 sm:mt-0">
        <app-button variant="primary" (clicked)="toggleCreateModal(true)">
          <svg class="-ml-1 mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Nuevo Usuario
        </app-button>
      </div>
    </div>

    <!-- Filter & Search Section (Molecule) -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <app-search-bar
        [query]="userService.currentSearch()"
        (search)="onSearch($event)"
      />
    </div>

    <!-- User Table Section (Organism) -->
    <app-user-table
      [users]="userService.filteredUsers()"
      (editUser)="onEditUser($event)"
      (deleteUser)="onDeleteUser($event)"
    />

    <!-- Modal para Crear Usuario (Molecule + Atoms composition) -->
    @if (showCreateModal()) {
      <div class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4 border border-slate-100">
          <div class="flex justify-between items-center border-b border-slate-100 pb-3">
            <h3 class="text-lg font-bold text-slate-900">Registrar Nuevo Usuario</h3>
            <button
              type="button"
              (click)="toggleCreateModal(false)"
              class="text-slate-400 hover:text-slate-600 rounded-md p-1 cursor-pointer"
            >
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <div class="space-y-4">
            <app-form-field label="Nombre Completo" [required]="true">
              <app-input
                placeholder="Ej. Andrés Ramírez"
                [value]="newUserName()"
                (valueChange)="newUserName.set($event)"
              />
            </app-form-field>

            <app-form-field label="Correo Electrónico" [required]="true">
              <app-input
                type="email"
                placeholder="andres@empresa.com"
                [value]="newUserEmail()"
                (valueChange)="newUserEmail.set($event)"
              />
            </app-form-field>

            <app-form-field label="Rol">
              <select
                [value]="newUserRole()"
                (change)="onRoleChange($event)"
                class="w-full px-3.5 py-2 text-sm bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition"
              >
                <option value="Admin">Admin</option>
                <option value="Editor">Editor</option>
                <option value="Viewer">Viewer</option>
              </select>
            </app-form-field>
          </div>

          <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
            <app-button variant="ghost" (clicked)="toggleCreateModal(false)">
              Cancelar
            </app-button>
            <app-button
              variant="primary"
              [disabled]="!newUserName() || !newUserEmail()"
              (clicked)="saveUser()"
            >
              Guardar Usuario
            </app-button>
          </div>
        </div>
      </div>
    }
  </div>
</app-main-layout>
